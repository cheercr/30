<!DOCTYPE html>
<html lang="th"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaizen Shop · Payments</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--pur:#8b3dff;--pur2:#c084fc;--gold:#e8c46a;--gold2:#fff1b8;--mut:#a597c8;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#05030c}
*{box-sizing:border-box;margin:0}
body{background:#05030c;color:#efe9ff;font-family:'Prompt',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;position:relative}
.aur{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,#1a0b3a,#05030c 70%)}
.aur i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:fl 14s ease-in-out infinite alternate}
.aur i:nth-child(1){width:60vmax;height:60vmax;left:-20vmax;top:-15vmax;background:#5b1fd0}
.aur i:nth-child(2){width:45vmax;height:45vmax;right:-15vmax;top:10vmax;background:#b8862b;opacity:.28;animation-delay:-5s}
.aur i:nth-child(3){width:55vmax;height:55vmax;left:15vmax;bottom:-25vmax;background:#7a2cf0;animation-delay:-9s}
@keyframes fl{to{transform:translate(8vmax,5vmax) scale(1.15)}}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.leds{position:relative;z-index:3;display:flex;justify-content:space-between;padding:10px 10px 0}
.leds b{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);animation:led 1.8s infinite}
.leds b:nth-child(3n){background:var(--pur2);box-shadow:0 0 10px var(--pur2)}
.leds b:nth-child(3n+1){animation-delay:.3s}.leds b:nth-child(3n+2){animation-delay:.9s}
@keyframes led{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.15;transform:scale(.6)}}
main{position:relative;z-index:2;max-width:1000px;margin:0 auto;padding:26px 16px 30px}
header{text-align:center;margin-bottom:22px}
.ring{position:relative;width:170px;height:170px;margin:0 auto 14px}
.ring:before{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(#8b3dffaa,transparent 68%);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.2);opacity:.6}}
.ring .rot{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--gold),var(--pur),var(--gold2),var(--pur2),var(--gold));animation:spin 5s linear infinite;-webkit-mask:radial-gradient(circle,transparent 62%,#000 63%);mask:radial-gradient(circle,transparent 62%,#000 63%)}
.ring img{position:absolute;inset:9px;width:calc(100% - 18px);height:calc(100% - 18px);border-radius:50%;object-fit:cover;background:#000}
.orb{position:absolute;inset:-6px;animation:spin 7s linear infinite}
.orb span{position:absolute;top:0;left:50%;color:var(--gold2);font-size:16px;text-shadow:0 0 10px var(--gold);transform:translateX(-50%)}
.orb.b{animation-duration:11s;animation-direction:reverse;inset:-20px}.orb.b span{color:var(--pur2);text-shadow:0 0 10px var(--pur);font-size:13px}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font:800 clamp(38px,11vw,76px)/1.05 Cinzel,serif;letter-spacing:.07em;background:linear-gradient(100deg,#b8862b,var(--gold2),#b8862b,var(--pur2),var(--gold2));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite;filter:drop-shadow(0 0 18px #8b3dff88)}
@keyframes shine{to{background-position:-300% 0}}
.sub{letter-spacing:.5em;color:var(--mut);font-size:12px;margin-top:6px}
.st{color:var(--gold);animation:tw 1.6s infinite;display:inline-block}.st:nth-of-type(2){animation-delay:.6s}
@keyframes tw{50%{opacity:.2;transform:scale(.6) rotate(45deg)}}
.tag{display:inline-block;margin-top:14px;padding:8px 18px;border:1px solid #e8c46a66;border-radius:99px;color:var(--gold);font-size:13px;background:#e8c46a12;position:relative;overflow:hidden}
.tag:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,#fff4,transparent);transform:skewX(-20deg);animation:sweep 3.2s infinite}
@keyframes sweep{to{left:130%}}
.tick{position:relative;z-index:2;overflow:hidden;border-block:1px solid #e8c46a44;background:#8b3dff14;margin:6px 0 26px;white-space:nowrap;padding:8px 0}
.tick div{display:inline-block;animation:mq 22s linear infinite;color:var(--gold);letter-spacing:.25em;font:600 12px Cinzel,serif}
@keyframes mq{to{transform:translateX(-50%)}}
.notice{max-width:620px;margin:0 auto 26px;text-align:center;font-size:14px;color:#dcd0f7;padding:12px 16px;border-radius:14px;background:#8b3dff1c;border:1px solid #8b3dff66;animation:nb 3s ease-in-out infinite}
@keyframes nb{50%{box-shadow:0 0 22px #8b3dff66}}
.grid{display:grid;gap:22px;max-width:780px;margin:0 auto;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{position:relative;border-radius:22px;padding:2px;background:linear-gradient(140deg,var(--gold),#3a1a7a 35%,var(--pur),var(--gold2),var(--gold));background-size:300% 300%;animation:up .9s both,bg 6s ease infinite;transition:transform .15s,box-shadow .3s}
.card:nth-child(2){animation-delay:.2s,0s}
@keyframes up{from{opacity:0;transform:translateY(28px)}}
@keyframes bg{50%{background-position:100% 100%}}
.card:hover{box-shadow:0 18px 60px #8b3dff55,0 0 30px #e8c46a33}
.inner{background:linear-gradient(160deg,#170d2e,#0a0515);border-radius:20px;padding:22px;height:100%;position:relative;overflow:hidden}
.inner:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),#e8c46a22,transparent 50%);pointer-events:none}
.cs{position:absolute;color:var(--gold);font-size:14px;animation:tw 2s infinite}
.cs.a{top:10px;right:14px}.cs.b{bottom:10px;left:14px;animation-delay:.8s;color:var(--pur2)}.cs.c{bottom:12px;right:16px;font-size:10px;animation-delay:1.3s}
.badge{display:flex;align-items:center;gap:8px;font:600 13px Cinzel,serif;letter-spacing:.2em;color:var(--gold)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--pur2);box-shadow:0 0 12px var(--pur2);animation:led 1.4s infinite}
.qr{width:min(250px,68vw);height:min(250px,68vw);margin:18px auto;border-radius:16px;background:#fff;position:relative;box-shadow:0 0 0 3px #0a0515,0 0 0 5px var(--gold),0 0 34px #8b3dff88;animation:glow 3s ease-in-out infinite}
.qr img{display:block;width:100%;height:100%;padding:12px;object-fit:contain;border-radius:16px}
@keyframes glow{50%{box-shadow:0 0 0 3px #0a0515,0 0 0 5px var(--gold2),0 0 50px #c084fcaa}}
.holder{font-size:18px;font-weight:500}
.bank{color:var(--mut);font-size:13px;margin:2px 0 12px}
.num{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:#ffffff0c;border:1px solid #e8c46a44;font-size:17px;color:var(--gold2)}
.num small{display:block;color:var(--mut);font-size:11px;letter-spacing:.2em}
button{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:7px 13px;font-size:12px;color:#1a1030;background:linear-gradient(120deg,var(--gold),var(--gold2));font-weight:500;transition:transform .15s,box-shadow .2s;white-space:nowrap}
button:hover{transform:scale(1.07);box-shadow:0 0 18px #e8c46a99}
.note{margin-top:12px;font-size:12px;color:var(--mut)}
footer{text-align:center;margin-top:36px;color:var(--mut);font-size:12px;letter-spacing:.2em}
footer b{color:var(--gold);font-family:Cinzel,serif}
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140px);padding:12px 22px;border-radius:99px;background:#120a24;border:1px solid var(--gold);color:var(--gold2);z-index:9;transition:transform .4s cubic-bezier(.2,1.4,.4,1);box-shadow:0 0 30px #8b3dff77}
#toast.on{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

#pg{position:fixed;top:0;left:0;height:3px;width:0;z-index:20;background:linear-gradient(90deg,var(--pur),var(--gold),var(--pur2));box-shadow:0 0 12px var(--gold)}
#sp{position:fixed;width:520px;height:520px;border-radius:50%;left:0;top:0;z-index:1;pointer-events:none;background:radial-gradient(#8b3dff30,#e8c46a10 40%,transparent 68%);opacity:0;transition:opacity .4s}
.aur:after{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 20%,#c084fc,transparent);opacity:0;animation:fz 9s infinite}
@keyframes fz{0%,91%,100%{opacity:0}92%{opacity:.35}93%{opacity:0}95%{opacity:.25}97%{opacity:0}}
.ring:after{content:"";position:absolute;left:50%;top:50%;width:min(460px,120vw);height:min(460px,120vw);z-index:-1;background:repeating-conic-gradient(#e8c46a30 0 5deg,transparent 5deg 15deg);-webkit-mask:radial-gradient(circle,transparent 20%,#000 30%,transparent 70%);mask:radial-gradient(circle,transparent 20%,#000 30%,transparent 70%);animation:spin2 30s linear infinite}
@keyframes spin2{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
.orb.c{inset:-32px;animation-duration:16s}.orb.c span{font-size:20px;color:var(--gold)}
h1{animation:shine 6s linear infinite,bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.tag{min-width:250px;transition:opacity .4s}
.live{margin-top:14px;font-size:12px;letter-spacing:.2em;color:#cbb8ff;display:flex;gap:8px;justify-content:center;align-items:center}
.live i{width:9px;height:9px;border-radius:50%;background:#46ff9c;box-shadow:0 0 0 0 #46ff9c;animation:ping 1.6s infinite}
@keyframes ping{70%{box-shadow:0 0 0 12px #46ff9c00}100%{box-shadow:0 0 0 0 #46ff9c00}}
.dv{display:flex;align-items:center;gap:12px;max-width:520px;margin:0 auto 24px;color:var(--gold)}
.dv:before,.dv:after{content:"";flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--gold),var(--pur2),transparent);background-size:200% 100%;animation:sweep2 3s linear infinite}
@keyframes sweep2{to{background-position:-200% 0}}
.dv span{animation:spin 6s linear infinite;display:inline-block}
.inner:after{content:"";position:absolute;top:-20%;left:-80%;width:40%;height:140%;background:linear-gradient(90deg,transparent,#ffffff22,transparent);transform:skewX(-20deg);transition:left .9s;pointer-events:none}
.card:hover .inner:after{left:140%}
.badge{animation:flick 5s infinite}
@keyframes flick{0%,18%,22%,62%,64%,100%{opacity:1;text-shadow:0 0 12px var(--gold)}20%,63%{opacity:.4;text-shadow:none}}
.qr{cursor:zoom-in}
.qr:before,.qr:after{content:"";position:absolute;width:26px;height:26px;border:3px solid var(--gold);animation:tw 2s infinite}
.qr:before{top:-9px;left:-9px;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.qr:after{bottom:-9px;right:-9px;border-left:0;border-top:0;border-radius:0 0 10px 0}
.hint{text-align:center;font-size:11px;color:var(--mut);letter-spacing:.15em;margin-top:-6px;margin-bottom:10px}
.tick.rev{margin:30px 0 0}.tick.rev div{animation-direction:reverse}
#zm{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:#05030ccc;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:zoom-out}
#zm.on{display:grid;animation:up .3s both}
#zm img{width:min(88vw,520px);border-radius:22px;background:#fff;padding:16px;box-shadow:0 0 0 4px var(--gold),0 0 80px #8b3dffcc}

const PAYMENTS=[{type:"BANK & WALLET",holder:"น.ส.รัตนพร แฉเกษม",bank:"สแกนได้ทั้งแอปธนาคารและวอเลท",num:"",note:"โอนแล้วแจ้งสลิปทุกครั้งนะคะ",qr:QR_IMG}];
const CONTACTS=[{k:"Facebook",v:"Rattanaporn Chaekasem"},{k:"Discord",v:"chxxr_cr"}];
/* ========================== */
const $=s=>document.querySelector(s),toast=$('#toast');
$('#notice').textContent=NOTICE;
$('#leds').innerHTML='<b></b>'.repeat(Math.min(40,Math.floor(innerWidth/22)));
const tk='✦ KAIZEN SHOP ✧ OFFICIAL PAYMENT ✦ โอนแล้วแจ้งสลิปทุกครั้ง ✧ '.repeat(4);$('#tk').textContent=tk+tk;
function copy(t){try{navigator.clipboard.writeText(t).catch(()=>{})}catch(e){}toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),1400)}
const g=$('#grid');
const sp='<span class="cs a">✦</span><span class="cs b">✧</span><span class="cs c">✦</span>';
PAYMENTS.forEach(p=>{const c=document.createElement('div');c.className='card';
c.innerHTML=`<div class="inner">${sp}<div class="badge"><span class="dot"></span>${p.type}</div><div class="qr"><img src="${p.qr}" alt="QR"></div><div class="hint">แตะที่ QR เพื่อขยาย</div><div class="holder">${p.holder}</div><div class="bank">${p.bank}</div>${p.num?`<div class="num"><span>${p.num}</span><button>คัดลอก</button></div>`:''}<div class="note">${p.note}</div></div>`;
const b=c.querySelector('button');if(b)b.onclick=()=>copy(p.num.replace(/-/g,''));g.appendChild(c)});
const cc=document.createElement('div');cc.className='card';
cc.innerHTML=`<div class="inner">${sp}<div class="badge"><span class="dot"></span>CONTACT US</div><div class="note" style="margin:14px 0 6px">ติดต่อสอบถามและส่งสลิปได้ที่</div>`+CONTACTS.map(t=>`<div class="num" style="margin-top:12px"><span><small>${t.k.toUpperCase()}</small>${t.v}</span><button data-v="${t.v}">คัดลอก</button></div>`).join('')+'</div>';
cc.querySelectorAll('button').forEach(b=>b.onclick=()=>copy(b.dataset.v));g.appendChild(cc);
/* tilt (mouse only) */
document.querySelectorAll('.card').forEach(c=>{c.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;c.style.transform=`perspective(900px) rotateY(${(x-.5)*10}deg) rotateX(${(.5-y)*10}deg)`;c.firstChild.style.setProperty('--mx',x*100+'%');c.firstChild.style.setProperty('--my',y*100+'%')});c.addEventListener('pointerleave',()=>c.style.transform='')});
/* stars, shooting stars, click bursts */
const cv=$('#c'),x=cv.getContext('2d');let W,H,S=[],B=[],M=[];
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0)}rs();addEventListener('resize',rs);
const cols=['#e8c46a','#fff1b8','#c084fc','#ffffff','#8b3dff'];
for(let i=0;i<Math.min(90,W/8);i++)S.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*5+1.5,c:cols[i%5],o:Math.random()*7,s:Math.random()*1.5+.5,v:Math.random()*.15+.03});
function star(cx,cy,r,rot){x.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4+rot,q=i%2?r*.28:r;x.lineTo(cx+Math.cos(a)*q,cy+Math.sin(a)*q)}x.closePath();x.fill()}
function boom(px,py){for(let i=0;i<16;i++){const a=Math.random()*6.28,s=Math.random()*3+1;B.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:cols[i%5]})}}
addEventListener('pointerdown',e=>boom(e.clientX,e.clientY));
(function f(t){x.clearRect(0,0,W,H);
S.forEach(p=>{p.y-=p.v;if(p.y<-10)p.y=H+10;x.globalAlpha=.25+.75*Math.abs(Math.sin(t/700*p.s+p.o));x.fillStyle=p.c;star(p.x,p.y,p.r,t/4000*p.s)});
